name: PR Check

# Validates contributor PRs and reports failures. The report always goes to the
# step summary; it is additionally posted as a PR comment only when the token is
# actually writable (see the note above the comment step).

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "getting-started/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/pr-check.yml"
      - "scripts/sarvam_api_rules.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Verify API rules reference is current
        run: python scripts/sync_sarvam_rules.py --check

      - name: Run full validation
        id: validate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python scripts/ci_validate.py --base-ref "$BASE_REF" --output validation-results.json
        continue-on-error: true

      # Rendering and posting are deliberately separate steps: a crash in
      # pr_comment.py must be distinguishable from a `gh` permission error.
      # continue-on-error here so neither can mask the validation failure below.
      - name: Render validation report
        if: steps.validate.outcome == 'failure'
        continue-on-error: true
        run: |
          python scripts/pr_comment.py \
            --input validation-results.json \
            --output pr-comment.md
          cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      # `pull_request` runs from a fork get a read-only GITHUB_TOKEN no matter
      # what `permissions:` requests, so commenting 403s for external
      # contributors (issue #127). The step summary above needs no write token.
      # Keep the comment only for same-repo PRs, where the grant is honoured.
      - name: Comment on pull request
        if: >-
          steps.validate.outcome == 'failure' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file pr-comment.md

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
